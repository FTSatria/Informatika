<style>

.pc{width:54px;height:76px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600;font-size:1.25rem;position:relative;transition:transform .18s,background .18s}

.pc.cmp{border-color:var(--accent);background:var(--tint);transform:translateY(-8px)}

.pc.mark::after{content:"min";position:absolute;bottom:-18px;font-size:.62rem;color:var(--hot)}

.pc.lo{border-color:var(--ok)}.pc.hi{border-color:var(--bad)}.pc.mid{border-color:var(--sun);background:var(--sun);color:var(--sun-ink)}.pc.dim{opacity:.3}.pc.found{background:var(--ok);color:#fff;border-color:var(--ok)}

.log div{padding:2px 0;border-bottom:1px dashed var(--line)}
.bar{height:14px;border-radius:7px;background:var(--code);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:7px;transition:width .3s}
.bar.h i{background:var(--hot)}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

.q{padding:16px 0;border-bottom:1px solid var(--line)}

.fb{margin-top:8px;font-size:.92rem;padding:8px 12px;border-radius:8px;background:var(--code)}
.score{font-family:var(--f-disp);font-size:3rem;font-weight:800;line-height:1}
.pager{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:56px;padding-top:20px;border-top:1px solid var(--line)}

svg.fc text{font-family:var(--f-mono);font-size:13px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}

.rub label{display:block;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;margin-top:6px;cursor:pointer;font-size:.9rem}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

  function render(){$('.stackbox',root).innerHTML=items.map(function(v,i){return '<div class="item'+(i===items.length-1?' top':'')+'">'+esc(v)+(i===items.length-1?'  ◀ TOP':'')+'</div>'}).join('');$('.log',root).innerHTML=log.slice(-8).reverse().map(function(l){return '<div>'+esc(l)+'</div>'}).join('');$('.cnt',root).textContent='Isi tumpukan: '+items.length;$('.pop',root).disabled=!items.length}
  $('.push',root).onclick=function(){var i=$('input',root);var v=i.value.trim()||String.fromCharCode(65+items.length%26);if(items.length>=7){log.push('Penuh (maks 7): '+v+' ditolak');render();return}items.push(v);log.push('PUSH '+v);i.value='';render()};
  $('.pop',root).onclick=function(){if(!items.length)return;var v=items.pop();log.push('POP → '+v);render()};
  render()}

    $$('#qz .pick',r).forEach(function(p){$$('button',p).forEach(function(b){b.onclick=function(){var i=Number(p.dataset.i);if(ans[i]!==undefined)return;var j=Number(b.dataset.j);ans[i]=j;var ok=j===QZ[i][3];b.classList.add(ok?'right':'wrong');if(!ok)$$('button',p)[QZ[i][3]].classList.add('right');var fb=p.nextElementSibling;fb.hidden=false;fb.textContent=(ok?'Benar. ':'Belum tepat. ')+QZ[i][4];show()}})});show()}
  qr();$('#qz-re',r).onclick=function(){qr();window.scrollTo({top:$('#qz',r).offsetTop,behavior:'smooth'})};
  var sv=load('rubrik',{});
  $('#rb',r).innerHTML=RB.map(function(a,i){return '<div class="lab rub" style="margin-top:0"><h3 style="font-size:1rem">'+a[0]+'</h3>'+a[1].map(function(d,j){return '<label><input type="radio" name="rb'+i+'" value="'+(j+1)+'"'+(sv[i]===j+1?' checked':'')+'><b>Skor '+(j+1)+'.</b> '+esc(d)+'</label>'}).reverse().join('')+'</div>'}).join('');
  function rbs(){var s=0,n=0;RB.forEach(function(a,i){var c=$('input[name=rb'+i+']:checked',r);if(c){s+=Number(c.value);n++;sv[i]=Number(c.value)}});save('rubrik',sv);$('#rb-sc',r).textContent=s+'/16';$('#rb-bar',r).style.width=(s/16*100)+'%';
    var avg=n?s/n:0;$('#rb-msg',r).textContent=n<4?('Terisi '+n+' dari 4 aspek.'):(avg>=3.5?'Tingkat Sangat Baik':avg>=2.5?'Tingkat Baik':avg>=1.5?'Tingkat Cukup':'Tingkat Kurang, ayo berlatih lagi')}
  $$('#rb input',r).forEach(function(e){e.onchange=rbs});rbs();
}};

/* ============ TINDAK LANJUT ============ */
views['tindak-lanjut']={html:function(){
  return '<div class="hero"><div class="eyebrow">Relevansi dan program susulan</div><h1>Pengayaan dan remedial</h1><p>Sudah menguasai materi? Tantang dirimu dengan studi kasus. Masih ragu pada percabangan dan tracing? Latih sampai lancar.</p></div>'+
  sec('Pengayaan','Efisiensi algoritma secara kualitatif','<div class="lab"><h3>Berapa langkah yang dibutuhkan?</h3><p class="hint">Geser jumlah data. Bandingkan langkah terburuk pencarian dan jumlah perbandingan pengurutan.</p><div class="row"><label class="f">jumlah data n: <b id="ef-nv">100</b><input type="range" id="ef-n" min="1" max="3" value="2" step="1" style="width:220px;accent-color:var(--accent)"></label></div><div id="ef-bars"></div><p class="hint">Quick Sort dan Merge Sort mengurutkan jauh lebih cepat pada data besar. Coba cari tahu cara kerjanya sebagai tantangan lanjutan.</p></div>')+
  sec('Pengayaan · Aktivitas 10.2-15-UP','Studi kasus survei desa','<div class="lab"><h3>Baca array, urutkan, hitung median</h3><p class="hint">Data jumlah anggota keluarga dari beberapa rumah. Ubah datanya sesukamu.</p><label class="f">data (pisahkan dengan koma)<input type="text" id="sv-d" value="4, 3, 5, 2, 6, 4, 3, 7, 4, 5, 2, 3" style="width:100%"></label><div class="cards" id="sv-raw"></div><div class="cards" id="sv-sorted"></div><div class="out" id="sv-out"></div></div>')+
  sec('Remedial','Tracing percabangan','<div class="lab"><h3>Tebak luaran pseudocode</h3><p class="hint">Telusuri baris demi baris dan catat nilai variabel sebelum menjawab.</p>'+code(['READ x','IF x > 10 THEN','  y ← x * 2','ELSE IF x = 10 THEN','  y ← 0','ELSE','  y ← x + 5','ENDIF','WRITE y'])+'<div class="row"><span class="chip sun" id="tr-x"></span><label class="f">luaran y<input type="number" id="tr-a"></label><button class="btn" id="tr-ok">Periksa</button><button class="btn ghost" id="tr-new">Soal baru</button><span class="chip" id="tr-sc">Benar: 0</span></div><div class="out" id="tr-out"></div></div>'+
   '<div class="grid"><div class="card"><h3>Tutor sebaya</h3><p style="color:var(--muted);margin:0">Berpasangan: satu orang membaca pseudocode, satu orang menulis nilai variabel di kertas. Bertukar peran tiap soal.</p></div><div class="card"><h3>Kebiasaan tracing</h3><p style="color:var(--muted);margin:0">Buat tabel kecil berisi nama variabel, lalu perbarui satu baris setiap kali satu baris kode dijalankan.</p></div></div>')+
  pager(['asesmen','Asesmen'],['beranda','Kembali ke Beranda']);
},init:function(r){
  function ef(){var n=Math.pow(10,Number($('#ef-n',r).value)),seq=n,bin=Math.ceil(Math.log2(n+1)),srt=n*(n-1)/2,mx=Math.max(seq,srt);$('#ef-nv',r).textContent=n.toLocaleString('id-ID');
    function row(l,v,c){return '<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:.88rem"><span>'+l+'</span><b style="font-family:var(--f-mono)">'+v.toLocaleString('id-ID')+'</b></div><div class="bar'+(c?' h':'')+'"><i style="width:'+Math.max(1,v/mx*100)+'%"></i></div></div>'}
    $('#ef-bars',r).innerHTML=row('Sequential Search (langkah terburuk)',seq,0)+row('Binary Search (langkah terburuk)',bin,0)+row('Bubble Sort (jumlah perbandingan)',srt,1)}
  $('#ef-n',r).oninput=ef;ef();
  function sv(){var d=$('#sv-d',r).value.split(',').map(function(x){return parseFloat(x.trim())}).filter(function(x){return !isNaN(x)});
    $('#sv-raw',r).innerHTML=d.map(function(v,i){return '<div class="pc cell"><small>'+i+'</small>'+v+'</div>'}).join('');
    var s=d.slice().sort(function(a,b){return a-b}),n=s.length;$('#sv-sorted',r).innerHTML=s.map(function(v,i){return '<div class="pc cell sorted"><small>'+i+'</small>'+v+'</div>'}).join('');
    if(!n){$('#sv-out',r).textContent='Masukkan data.';return}
    var med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2,sum=s.reduce(function(a,b){return a+b},0);
    $('#sv-out',r).innerHTML='n = '+n+'<br>'+(n%2?'n ganjil: median = data urut ke-'+((n+1)/2)+' = '+med:'n genap: median = rata-rata data ke-'+(n/2)+' dan ke-'+(n/2+1)+' = ('+s[n/2-1]+' + '+s[n/2]+') / 2 = '+med)+'<br>rata-rata = '+Math.round(sum/n*100)/100+'   min = '+s[0]+'   maks = '+s[n-1]}
  $('#sv-d',r).oninput=sv;sv();
  var x,sc=0;function nx(){x=rnd(5,15);$('#tr-x',r).textContent='x = '+x;$('#tr-a',r).value='';$('#tr-out',r).className='out';$('#tr-out',r).textContent=''}
  nx();$('#tr-new',r).onclick=nx;
  $('#tr-ok',r).onclick=function(){var y=x>10?x*2:x===10?0:x+5,a=$('#tr-a',r).value,o=$('#tr-out',r);if(a===''){o.textContent='Isi jawabanmu dulu.';return}
    var ok=Number(a)===y;if(ok)sc++;o.className='out '+(ok?'ok':'bad');o.textContent=ok?'Benar. y = '+y+'.':'Belum tepat. Untuk x = '+x+', kondisi yang berlaku: '+(x>10?'x > 10, jadi y = x * 2 = '+y:x===10?'x = 10, jadi y = 0':'ELSE, jadi y = x + 5 = '+y)+'.';$('#tr-sc',r).textContent='Benar: '+sc}
}};

/* ============ ROUTER ============ */
function buildNav(cur){$('#nav').innerHTML=order.map(function(o){return '<a href="#'+o[0]+'"'+(o[0]===cur?' class="on" aria-current="page"':'')+'>'+o[1]+'</a>'}).join('');var on=$('#nav a.on');if(on&&on.scrollIntoView)try{on.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}
var current='';
function render(){var k=(location.hash||'').replace('#','');if(!views[k])k='beranda';current=k;var app=$('#app');app.innerHTML=views[k].html();views[k].init(app);buildNav(k);document.title='Algoritma dan Struktur Data';window.scrollTo(0,0)}
window.addEventListener('hashchange',render);
render();
})();
</script>
