<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lab Algoritma dan Struktur Data</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: lembar kerja ala "sticker kampus" — kartu bergaris tebal dengan bayangan keras, satu halaman per pertemuan. */
:root{
  --bg:#EDF0F7; --card:#FFFFFF; --soft:#E1E6F2; --ink:#101322; --muted:#566079; --line:#101322;
  --lime:#C8F23A; --coral:#FF6F59; --sky:#57C7FF; --sun:#FFD23F; --mint:#3DDC97; --on:#101322;
  --good:#16a46a; --bad:#e04a38;
  --f-head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --sh:4px 4px 0 var(--line);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --card:#181C31; --soft:#232844; --ink:#EDF0F7; --muted:#A3ACC9; --line:#DDE2F3;
  --good:#3DDC97; --bad:#FF8A78; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1120; --card:#181C31; --soft:#232844; --ink:#EDF0F7; --muted:#A3ACC9; --line:#DDE2F3;
  --good:#3DDC97; --bad:#FF8A78; color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.12;margin:0 0 .5em;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:800}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:800}
h3{font-size:1.2rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0 0 .9em;max-width:70ch}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.sr{position:absolute;left:-9999px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:2.5px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 0}
.logo{font-family:var(--f-head);font-weight:800;font-size:1.15rem;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{display:inline-grid;place-items:center;background:var(--lime);color:var(--on);border:2px solid var(--line);border-radius:8px;
  width:30px;height:30px;font:700 .85rem var(--f-mono);font-style:normal;box-shadow:2px 2px 0 var(--line)}
.nav{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding:4px 2px}
.nav a{white-space:nowrap;text-decoration:none;font-weight:600;font-size:.9rem;padding:6px 12px;border:2px solid transparent;border-radius:999px}
.nav a:hover{border-color:var(--line)}
.nav a.on{background:var(--ink);color:var(--bg)}
.pill{white-space:nowrap;font:700 .8rem var(--f-mono);border:2px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--sun);color:var(--on)}
.tbtn{border:2px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:1rem}

main{max-width:1100px;margin:0 auto;padding-top:28px}
section.blk{margin:0 0 40px}
.eyebrow{display:inline-block;font:700 .75rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--line);
  background:var(--card);padding:3px 10px;border-radius:999px;margin-bottom:12px}

/* surfaces */
.card{background:var(--card);border:2.5px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card.lime{background:var(--lime);color:var(--on)} .card.sun{background:var(--sun);color:var(--on)}
.card.sky{background:var(--sky);color:var(--on)} .card.coral{background:var(--coral);color:var(--on)}
.card.mint{background:var(--mint);color:var(--on)}
.card.lime .muted,.card.sun .muted,.card.sky .muted,.card.coral .muted,.card.mint .muted{color:#2a2f45}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;border:2.5px solid var(--line);border-radius:12px;
  background:var(--card);padding:9px 16px;box-shadow:3px 3px 0 var(--line);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.btn.pri{background:var(--lime);color:var(--on)} .btn.sec{background:var(--sky);color:var(--on)}
.btn.warn{background:var(--coral);color:var(--on)} .btn.sm{padding:5px 11px;font-size:.85rem;box-shadow:2px 2px 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:2px 2px 0 var(--line)}
input[type=text],input[type=number],select,textarea{background:var(--card);border:2.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;max-width:100%}
textarea{width:100%;min-height:88px;resize:vertical;font-family:var(--f-mono);font-size:.9rem}
input[type=range]{accent-color:var(--coral);width:100%}
label{font-weight:600;font-size:.9rem}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}

/* tabs, chips */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{cursor:pointer;border:2.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
.tab.on{background:var(--ink);color:var(--bg)}
.chip{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:2px 10px;font:700 .75rem var(--f-mono);background:var(--card)}
.chip.t{background:var(--lime);color:var(--on)} .chip.f{background:var(--coral);color:var(--on)}
.badge{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 8px;border:2px solid var(--line);border-radius:8px;background:var(--sun);color:var(--on);font:700 .75rem var(--f-mono)}

/* code */
.code{margin:0;background:#0F1324;color:#E8ECFA;border:2.5px solid var(--line);border-radius:12px;padding:10px 0;overflow-x:auto;font:500 .88rem/1.65 var(--f-mono)}
.code .ln{white-space:pre;padding:0 14px 0 8px;border-left:4px solid transparent}
.code .ln.on{background:#2A3560;border-left-color:var(--sun)}
.code .no{display:inline-block;width:2ch;margin-right:12px;color:#6b749a;text-align:right;user-select:none}
.code .k{color:#7FD6FF;font-weight:700} .code .s{color:#B9F27C} .code .o{color:#FFB86B;font-weight:700} .code .n{color:#FF9DB0}
code.i{font-family:var(--f-mono);font-size:.88em;background:var(--soft);border-radius:6px;padding:1px 6px}

/* tables */
.tw{overflow-x:auto;border:2.5px solid var(--line);border-radius:12px;background:var(--card)}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t th{background:var(--ink);color:var(--bg);text-align:left;padding:8px 12px;font-family:var(--f-head)}
table.t td{padding:8px 12px;border-top:1.5px solid var(--soft);vertical-align:top}
table.t tr.hot td{background:color-mix(in srgb,var(--sun) 45%,transparent)}
.st-ok{color:var(--good);font-weight:800} .st-no{color:var(--bad);font-weight:800}

/* MC */
.mc{margin-bottom:14px}
.mc-o{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.opt{text-align:left;cursor:pointer;background:var(--card);border:2.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:500}
.opt:hover:not([disabled]){background:var(--soft)}
.opt.good{background:var(--mint);color:var(--on);font-weight:700} .opt.bad{background:var(--coral);color:var(--on);text-decoration:line-through}
.opt.pick{background:var(--sky);color:var(--on);font-weight:700}
.mc-fb{min-height:1.2em;font-size:.92rem}

/* flowchart */
.fc{width:100%;height:auto;max-width:560px;display:block;margin:0 auto}
.fc .nd rect,.fc .nd polygon{fill:var(--card);stroke:var(--line);stroke-width:2.5}
.fc .nd text{fill:var(--ink);font:600 12.5px var(--f-mono);text-anchor:middle}
.fc .nd.hot rect,.fc .nd.hot polygon{fill:var(--sun)} .fc .nd.hot text{fill:#101322}
.fc .ar{stroke:var(--line);stroke-width:2.5;fill:none}
.fc .lb{fill:var(--ink);font:700 12px var(--f-mono)}

/* sort cards */
.deck{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:18px 4px}
.pc{width:58px;height:82px;border:2.5px solid var(--line);border-radius:10px;background:var(--card);display:grid;place-items:center;
  font:800 1.5rem var(--f-head);box-shadow:3px 3px 0 var(--line);transition:transform .15s,background .15s;position:relative}
.pc.cmp{background:var(--sun);color:var(--on);transform:translateY(-8px)} .pc.swp{background:var(--coral);color:var(--on);transform:translateY(-8px)}
.pc.fin{background:var(--mint);color:var(--on)} .pc.key{background:var(--sky);color:var(--on);transform:translateY(-8px)}
.pc small{position:absolute;bottom:-20px;font:600 .65rem var(--f-mono);color:var(--muted)}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat div{border:2.5px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card);font-weight:700}
.stat b{font:800 1.3rem var(--f-head);margin-left:6px}

/* search arena */
.cells{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.cell{width:46px;padding:8px 0 4px;text-align:center;border:2.5px solid var(--line);border-radius:8px;background:var(--card);font:700 .95rem var(--f-mono);transition:opacity .2s}
.cell small{display:block;font-size:.6rem;color:var(--muted);font-weight:500}
.cell.out{opacity:.22} .cell.mid{background:var(--sun);color:var(--on)} .cell.found{background:var(--mint);color:var(--on)} .cell.look{background:var(--sky);color:var(--on)}

/* stack & queue */
.tower{display:flex;flex-direction:column-reverse;gap:6px;min-height:230px;justify-content:flex-start;padding:10px;border:2.5px dashed var(--line);border-radius:12px;background:var(--soft)}
.blk-i{border:2.5px solid var(--line);border-radius:8px;background:var(--card);padding:6px 10px;font-weight:700;position:relative;min-width:0;overflow-wrap:anywhere}
.blk-i.top{background:var(--lime);color:var(--on)}
.blk-i.top::after{content:"TOP";position:absolute;right:8px;top:50%;transform:translateY(-50%);font:700 .65rem var(--f-mono)}
.lane{display:flex;gap:8px;align-items:stretch;overflow-x:auto;padding:22px 6px 26px;border:2.5px dashed var(--line);border-radius:12px;background:var(--soft);min-height:110px}
.q-i{flex:0 0 auto;min-width:78px;border:2.5px solid var(--line);border-radius:10px;background:var(--card);padding:8px 10px;text-align:center;font-weight:700;position:relative}
.q-i small{display:block;font:600 .65rem var(--f-mono);color:var(--muted)}
.q-i.front{background:var(--lime);color:var(--on)} .q-i.front::before{content:"FRONT";position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:700 .6rem var(--f-mono);color:var(--ink)}
.q-i.rear::after{content:"REAR";position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font:700 .6rem var(--f-mono);color:var(--ink)}
.q-i.empty{background:transparent;border-style:dashed;color:var(--muted)}
.log{font:500 .82rem var(--f-mono);background:var(--soft);border-radius:10px;padding:10px;max-height:140px;overflow:auto;min-height:48px}

/* misc */
.bar{height:16px;border:2px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);transition:width .3s}
.mission{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2.5px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none;font-weight:600}
.mission .badge{background:var(--soft)} .mission.ok{background:var(--lime);color:var(--on)} .mission.ok .badge{background:var(--card)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:80;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.flip{perspective:900px;cursor:pointer;min-height:150px;border:0;background:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;min-height:170px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;border:2.5px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);overflow:auto}
.flip .fa{background:var(--card)} .flip .fb{background:var(--sky);color:var(--on);transform:rotateY(180deg);font-size:.92rem}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;margin-bottom:36px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hl{background:var(--lime);color:var(--on);padding:0 .18em;border-radius:8px}
.ok-note{border:2.5px solid var(--line);background:var(--mint);color:var(--on);border-radius:12px;padding:10px 14px;font-weight:700}
.bad-note{border:2.5px solid var(--line);background:var(--coral);color:var(--on);border-radius:12px;padding:10px 14px;font-weight:700}
.info-note{border:2.5px solid var(--line);background:var(--sun);color:var(--on);border-radius:12px;padding:10px 14px}
details.ans{border:2.5px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--card)}
details.ans summary{cursor:pointer;font-weight:700}
.rub td.pick{background:var(--sun);color:var(--on);font-weight:600}
.rub td.cellp{cursor:pointer}
.rub td.cellp:hover{background:var(--soft)}
.pz{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.pzl{border:2.5px solid var(--line);border-radius:8px;background:var(--card);padding:5px 10px;font:600 .85rem var(--f-mono);cursor:pointer}
.pzl.right{background:var(--mint);color:var(--on)} .pzl.wrong{background:var(--coral);color:var(--on)}
.ans-list{display:flex;flex-direction:column;gap:6px;min-height:46px;border:2.5px dashed var(--line);border-radius:12px;padding:8px;background:var(--soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

</style>
<header class="top"><div class="top-in"><a class="logo" href="#beranda" data-go="beranda"><i>BK</i>Lab Algoritma</a><nav class="nav" id="nav" aria-label="Navigasi utama"></nav><span class="pill" id="prog">0/14 misi</span><button class="tbtn" id="tbtn" aria-label="Ganti tema terang atau gelap">◐</button></div></header>
<main id="view"></main>
<div class="toast" id="toast" role="status"></div>
<script>
/* ===== core: helper, penyimpanan, router, komponen bersama ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem('bk_' + k); if (v !== null) return JSON.parse(v); } catch (e) {} return k in mem ? mem[k] : d; },
  set(k, v) { mem[k] = v; try { localStorage.setItem('bk_' + k, JSON.stringify(v)); } catch (e) {} }
};
const timers = [];
const later = (fn, ms) => { const t = setInterval(fn, ms); timers.push(t); return t; };
const clearTimers = () => { while (timers.length) clearInterval(timers.pop()); };
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rp = n => 'Rp' + Number(n).toLocaleString('id-ID');

/* daftar aktivitas sesuai modul ajar */
const ACTS = {
  a01: ['10.2-01-U', 'Menelusuri Diagram Alir', 'p1'], a02: ['10.2-02-U', 'Membaca Pseudocode', 'p1'], a03: ['10.2-03-U', 'Menulis Algoritma', 'p1'],
  a04: ['10.2-04-U', 'Latihan Ekspresi', 'p2'], a05: ['10.2-05-U', 'Percabangan IF-THEN-ELSE', 'p2'], a06: ['10.2-06-U', 'Perulangan WHILE', 'p2'],
  a07: ['10.2-07-UP', 'Latihan Fungsi', 'p2'], a08: ['10.2-08-UP', 'Membuat Kasus Uji', 'p2'],
  a09: ['10.2-09-U', 'Mencari dan Mengurutkan', 'p3'], a10: ['10.2-10-UP', 'Tebak Angka Binary Search', 'p3'], a11: ['10.2-11-UP', 'Bermain Kartu Pengurutan', 'p3'],
  a12: ['10.2-12-U', 'Stack, Queue, List/Array', 'p4'], a13: ['10.2-13-UP', 'Simulasi Stack Undo/Redo', 'p4'], a14: ['10.2-14-UP', 'Simulasi Queue Antrean', 'p4']
};
let done = store.get('done', {});
function markDone(id) {
  if (done[id]) return;
  done[id] = 1; store.set('done', done); updProgress();
  toast('Misi ' + ACTS[id][0] + ' selesai!');
}
const doneCount = () => Object.keys(ACTS).filter(k => done[k]).length;
function updProgress() { const el = $('#prog'); if (el) el.textContent = doneCount() + '/' + Object.keys(ACTS).length + ' misi'; }
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
function copyText(text, okMsg) {
  const fallback = () => { const ta = $('#copybox'); if (ta) { ta.hidden = false; ta.value = text; ta.select(); } toast('Teks dipilih, tekan Ctrl+C untuk menyalin'); };
  try { navigator.clipboard.writeText(text).then(() => toast(okMsg || 'Tersalin!'), fallback); } catch (e) { fallback(); }
}

/* ===== penyorotan pseudocode ===== */
const KW = /("[^"\n]*")|\b(ALGORITMA|DEKLARASI|INPUT|OUTPUT|IF|THEN|ELSE|ENDIF|WHILE|DO|ENDWHILE|FOR|TO|ENDFOR|FUNCTION|RETURN|ENDFUNCTION|AND|OR|NOT|MOD|INTEGER|STRING|BOOLEAN|REAL)\b|(&lt;-)|(\b\d+(?:\.\d+)?\b)/g;
const hl = line => esc(line).replace(KW, (m, s, k, a, n) => s ? `<span class="s">${s}</span>` : k ? `<span class="k">${k}</span>` : a ? `<span class="o">${a}</span>` : `<span class="n">${n}</span>`);
function code(src, id) {
  const ls = src.replace(/^\n/, '').replace(/\s+$/, '').split('\n');
  return `<pre class="code"${id ? ` id="${id}"` : ''}>${ls.map((l, i) => `<div class="ln" data-ln="${i}"><span class="no">${i + 1}</span>${hl(l) || ' '}</div>`).join('')}</pre>`;
}
function litLine(id, n) { $$(`#${id} .ln`).forEach(el => el.classList.toggle('on', +el.dataset.ln === n)); }

/* ===== pilihan ganda berulang ===== */
function mcHTML(id, items) {
  return items.map((it, i) => `<div class="mc card flat" data-mc="${id}" data-i="${i}"><div><b>${i + 1}.</b> ${it.q}</div>${it.code ? `<div style="margin-top:8px">${code(it.code)}</div>` : ''}
  <div class="mc-o">${it.o.map((o, j) => `<button class="opt" data-j="${j}">${o}</button>`).join('')}</div><div class="mc-fb" aria-live="polite"></div></div>`).join('');
}
function mcInit(id, items, cb) {
  const ok = new Set();
  $$(`[data-mc="${id}"]`).forEach(box => {
    const i = +box.dataset.i;
    box.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || ok.has(i) || b.disabled) return;
      const j = +b.dataset.j, fb = $('.mc-fb', box);
      if (j === items[i].a) {
        b.classList.add('good'); ok.add(i); fb.innerHTML = '✅ ' + items[i].why;
        $$('.opt', box).forEach(x => x.disabled = true);
        if (ok.size === items.length && cb) cb();
      } else { b.classList.add('bad'); b.disabled = true; fb.innerHTML = '❌ Belum tepat. ' + (items[i].hint || 'Telusuri lagi dengan teliti.'); }
    });
  });
}

/* ===== stepper generik: langkah demi langkah ===== */
function makeStepper(o) {
  let steps = o.steps, i = -1, auto = null;
  const api = {
    set(s) { steps = s; api.reset(); },
    reset() { api.stop(); i = -1; o.onReset && o.onReset(); },
    next() { if (i < steps.length - 1) { i++; o.onStep(steps[i], i); if (i === steps.length - 1) { api.stop(); o.onEnd && o.onEnd(steps[i], i); } return true; } return false; },
    play(ms) { api.stop(); if (i >= steps.length - 1) api.reset(); auto = later(() => { if (!api.next()) api.stop(); }, ms || 700); },
    stop() { if (auto) { clearInterval(auto); auto = null; } },
    get idx() { return i; }, get len() { return steps.length; }
  };
  return api;
}

const pages = {};
let cur = 'beranda';
const NAV = [['beranda', 'Beranda'], ['materi', 'Materi'], ['p1', 'Pertemuan 1'], ['p2', 'Pertemuan 2'], ['p3', 'Pertemuan 3'], ['p4', 'Pertemuan 4'], ['lkpd', 'LKPD'], ['asesmen', 'Asesmen'], ['susulan', 'Pengayaan & Remedial']];
function route(push) {
  clearTimers();
  const p = pages[cur] || pages.beranda;
  $('#view').innerHTML = p.render();
  $$('.nav a').forEach(a => a.classList.toggle('on', a.dataset.go === cur));
  const act = $('.nav a.on'); if (act && act.scrollIntoView) { try { act.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} }
  window.scrollTo(0, 0);
  if (p.init) p.init();
  updProgress();
}
function go(id) {
  if (!pages[id]) id = 'beranda';
  cur = id;
  try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (e) {}
  route();
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-go]'); if (!a) return;
  e.preventDefault(); go(a.dataset.go);
});
window.addEventListener('hashchange', () => { const h = (location.hash || '').slice(1); if (pages[h] && h !== cur) { cur = h; route(); } });

function boot() {
  $('#nav').innerHTML = NAV.map(n => `<a href="#${n[0]}" data-go="${n[0]}">${n[1]}</a>`).join('');
  $('#tbtn').addEventListener('click', () => {
    const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', r.dataset.theme);
  });
  const th = store.get('theme', null); if (th) document.documentElement.dataset.theme = th;
  const h = (location.hash || '').slice(1);
  cur = pages[h] ? h : 'beranda';
  route();
}

  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker></defs>
  <g class="ar" marker-end="url(#ah)">
    <path d="M210 50V78"/><path d="M210 120V148"/><path d="M330 205H425V288"/><path d="M210 260V288"/>
    <path d="M425 338V375H210" marker-end="none"/><path d="M210 338V398" /><path d="M210 440V468"/>
  </g>
  <g class="nd" id="n-start"><rect x="150" y="10" width="120" height="40" rx="20"/><text x="210" y="35">Mulai</text></g>
  <g class="nd" id="n-in"><polygon points="120,80 310,80 290,120 100,120"/><text x="205" y="105">INPUT totalBelanja</text></g>
  <g class="nd" id="n-dec"><polygon points="210,150 330,205 210,260 90,205"/><text x="210" y="201">totalBelanja</text><text x="210" y="218">&gt; 100000 ?</text></g>
  <g class="nd" id="n-yes"><rect x="345" y="290" width="160" height="48"/><text x="425" y="311">totalBayar &lt;-</text><text x="425" y="328">totalBelanja - 10000</text></g>
  <g class="nd" id="n-no"><rect x="130" y="290" width="160" height="48"/><text x="210" y="311">totalBayar &lt;-</text><text x="210" y="328">totalBelanja</text></g>
  <g class="nd" id="n-out"><polygon points="120,400 310,400 290,440 100,440"/><text x="205" y="425">OUTPUT totalBayar</text></g>
  <g class="nd" id="n-end"><rect x="150" y="470" width="120" height="40" rx="20"/><text x="210" y="495">Selesai</text></g>
  <text class="lb" x="338" y="196">Ya</text><text class="lb" x="222" y="280">Tidak</text>
  </svg>`;
}
function discountSteps(T) {
  const dec = T > 100000, s = [], v = { tb: '?', by: '?' };
  const push = (ln, nd, k, o, note) => s.push({ ln, nd, tb: v.tb, by: v.by, k, o, note });
  push(0, 'n-start', '', '', 'Program dimulai.');
  v.tb = T; push(4, 'n-in', '', '', `INPUT: totalBelanja diisi ${T}.`);
  push(5, 'n-dec', dec ? 'BENAR' : 'SALAH', '', `Cek ${T} > 100000, hasilnya ${dec ? 'BENAR, masuk blok THEN' : 'SALAH, loncat ke blok ELSE'}.`);
  if (dec) { v.by = T - 10000; push(6, 'n-yes', '', '', `totalBayar &lt;- ${T} - 10000 = ${v.by}.`); }
  else { v.by = T; push(8, 'n-no', '', '', `totalBayar &lt;- ${T} (tanpa potongan).`); }
  push(10, 'n-out', '', String(v.by), `OUTPUT: layar menampilkan ${v.by}.`);
  push(10, 'n-end', '', '', 'Program selesai.');
  return s;
}

    ${closing('Penutup dan refleksi', 'Kenapa kita perlu menelusuri logika (tracing) sebelum menuliskan program? Tulis satu alasan dengan contohmu sendiri. Pertemuan berikutnya kita menulis pseudocode lengkap dengan percabangan, perulangan, fungsi, dan kasus uji.', 'p1')}
    ${pager(['materi', 'Materi'], ['p2', 'Pertemuan 2'])}`;
  },
  init() {
    /* --- stepper diskon --- */
    let T = 150000, ended = false, builderOK = 0;
    const tbody = $('#dk-tbl tbody');
    const chk = () => { if (ended && builderOK >= 2) markDone('a01'); };
    const st = makeStepper({
      steps: discountSteps(T),
      onReset() { tbody.innerHTML = ''; litLine('dk-code', -1); $$('.fc .nd').forEach(n => n.classList.remove('hot')); $('#dk-note').innerHTML = 'Tekan "Langkah berikutnya" untuk memulai.'; $('#dk-next').disabled = false; },
      onStep(s, i) {
        litLine('dk-code', s.ln); $$('.fc .nd').forEach(n => n.classList.toggle('hot', n.id === s.nd));
        $('#dk-note').innerHTML = `<b>Langkah ${i + 1}:</b> ${s.note}`;
        const tr = document.createElement('tr'); if (s.k) tr.className = 'hot';
        tr.innerHTML = `<td>${i + 1}</td><td>${s.ln + 1}</td><td>${s.tb}</td><td>${s.by}</td><td>${s.k || '-'}</td><td>${s.o || '-'}</td>`; tbody.appendChild(tr);
      },
      onEnd() { $('#dk-next').disabled = true; ended = true; $('#dk-note').innerHTML += ' ✅'; chk(); }
    });
    const setT = v => { T = Math.max(0, parseInt(v, 10) || 0); $('#dk-in').value = T; ended = false; st.set(discountSteps(T)); };
    $('#dk-next').addEventListener('click', () => st.next());
    $('#dk-auto').addEventListener('click', () => st.play(750));
    $('#dk-reset').addEventListener('click', () => st.reset());
    $('#dk-in').addEventListener('change', e => setT(e.target.value));
    $$('[data-v]').forEach(b => b.addEventListener('click', () => setT(b.dataset.v)));

    /* --- builder trace A,B --- */
    let no = 0;
    $('#tb-add').addEventListener('click', () => {
      const A = parseFloat($('#tb-a').value), B = parseFloat($('#tb-b').value);
      if (isNaN(A) || isNaN(B)) { $('#tb-msg').textContent = 'Isi angka A dan B dulu.'; return; }
      const real = A > B, k = $('#tb-k').value, o = $('#tb-o').value;
      const rk = real ? 'BENAR' : 'SALAH', ro = real ? 'Cetak "A Lebih Besar"' : '-';
      const ok = k === rk && o === ro; no++;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${no}</td><td>${A}</td><td>${B}</td><td>${rk}</td><td>${esc(ro)}</td><td class="${ok ? 'st-ok' : 'st-no'}">${ok ? '✓ tebakanmu tepat' : '✗ tebakanmu ' + esc(k) + ' / ' + esc(o)}</td>`;
      $('#tb-tbl tbody').appendChild(tr);
      if (ok) { builderOK++; $('#tb-msg').textContent = A === B ? 'Mantap, A sama dengan B membuat A > B SALAH.' : 'Tepat. Coba pasangan angka lain, termasuk yang sama besar.'; chk(); }
      else $('#tb-msg').textContent = 'Belum tepat. Baca ulang aturannya, lalu coba lagi dengan angka lain.';
    });

    /* --- MC --- */
    mcInit('p1mc', P1_MC, () => markDone('a02'));

    /* --- parsons --- */
    let key = 'diskon', pool = [], ans = [];
    const renderPz = (mark) => {
      const L = PARSONS[key].lines;
      $('#pz-pool').innerHTML = pool.map((t, i) => `<button class="pzl" data-add="${i}">${hl(t)}</button>`).join('') || '<span class="muted">Semua baris sudah dipakai.</span>';
      $('#pz-ans').innerHTML = ans.map((t, i) => `<button class="pzl ${mark ? (t === L[i] ? 'right' : 'wrong') : ''}" data-del="${i}">${i + 1}. ${hl(t)}</button>`).join('') || '<span class="muted">Belum ada baris.</span>';
      $$('[data-add]').forEach(b => b.addEventListener('click', () => { ans.push(pool.splice(+b.dataset.add, 1)[0]); $('#pz-msg').innerHTML = ''; renderPz(); }));
      $$('[data-del]').forEach(b => b.addEventListener('click', () => { pool.push(ans.splice(+b.dataset.del, 1)[0]); pool = shuffle(pool); $('#pz-msg').innerHTML = ''; renderPz(); }));
    };
    const resetPz = () => { pool = shuffle(PARSONS[key].lines); ans = []; $('#pz-msg').innerHTML = ''; renderPz(); };
    $$('[data-pz]').forEach(b => b.addEventListener('click', () => { key = b.dataset.pz; $$('[data-pz]').forEach(x => x.classList.toggle('on', x === b)); resetPz(); }));
    $('#pz-reset').addEventListener('click', resetPz);
    $('#pz-check').addEventListener('click', () => {
      const L = PARSONS[key].lines;
      if (ans.length < L.length) { $('#pz-msg').innerHTML = '<div class="info-note">Susun semua baris dulu, ya.</div>'; return; }
      renderPz(true);
      const good = ans.every((t, i) => t === L[i]);
      $('#pz-msg').innerHTML = good ? '<div class="ok-note">Urutan benar! Algoritmamu bisa ditelusuri dari atas ke bawah. Coba juga algoritma yang lain.</div>' : '<div class="bad-note">Ada baris yang belum pas (merah). Ketuk baris itu untuk memindahkannya.</div>';
      if (good) markDone('a03');
    });
    resetPz();
    bindRef('p1');
  }
};

const SORTED15 = [3, 8, 12, 19, 23, 31, 40, 47, 55, 62, 71, 78, 84, 91, 97];

function searchSteps(arr, t, mode) {
  const s = [], n = arr.length;
  if (mode === 'seq') {
    for (let i = 0; i < n; i++) {
      const hit = arr[i] === t;
      s.push({ look: i, lo: 0, hi: n - 1, mid: -1, found: hit ? i : -1, c: i + 1, msg: `Cek indeks ${i}: ${arr[i]} ${hit ? '=' : '≠'} ${t}.${hit ? ' Ketemu!' : ''}`, end: hit });
      if (hit) return s;
    }
    s.push({ look: -1, lo: 0, hi: n - 1, mid: -1, found: -1, c: n, msg: `Semua ${n} data sudah dicek. ${t} tidak ada.`, end: true });
    return s;
  }
  let lo = 0, hi = n - 1, c = 0;
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2); c++;
    if (arr[mid] === t) { s.push({ look: -1, lo, hi, mid, found: mid, c, msg: `Tengah = indeks ${mid} (${arr[mid]}) sama dengan ${t}. Ketemu!`, end: true }); return s; }
    const less = arr[mid] < t;
    s.push({ look: -1, lo, hi, mid, found: -1, c, msg: `Tengah = indeks ${mid} (${arr[mid]}). ${arr[mid]} ${less ? '&lt;' : '&gt;'} ${t}, jadi buang bagian ${less ? 'kiri' : 'kanan'}.` });
    if (less) lo = mid + 1; else hi = mid - 1;
  }
  s.push({ look: -1, lo, hi, mid: -1, found: -1, c, msg: 'Rentang pencarian habis. Target tidak ditemukan.', end: true });
  return s;
}

function sortSteps(alg, input) {
  const a = input.slice(), n = a.length, st = []; let c = 0, w = 0; const fin = new Set();
  const snap = (msg, o = {}) => st.push({ a: a.slice(), c, w, msg, cmp: o.cmp || [], swp: o.swp || [], key: o.key || [], fin: Array.from(fin) });
  const finAll = () => { for (let k = 0; k < n; k++) fin.add(k); };
  snap('Kartu awal. Tekan "Langkah berikutnya".');
  if (alg === 'bubble') {
    for (let i = 0; i < n - 1; i++) {
      let sw = false;
      for (let j = 0; j < n - 1 - i; j++) {
        c++; snap(`Bandingkan ${a[j]} dengan ${a[j + 1]}.`, { cmp: [j, j + 1] });
        if (a[j] > a[j + 1]) { const x = a[j], y = a[j + 1]; a[j] = y; a[j + 1] = x; w++; sw = true; snap(`${x} &gt; ${y}, jadi keduanya ditukar.`, { swp: [j, j + 1] }); }
      }
      fin.add(n - 1 - i);
      if (!sw) { finAll(); snap(`Putaran ${i + 1} tanpa pertukaran: kartu sudah terurut, berhenti lebih awal.`); break; }
      snap(`Putaran ${i + 1} selesai. Kartu ${a[n - 1 - i]} sudah di posisi akhirnya.`);
    }
    finAll(); snap('Selesai! Semua kartu terurut.');
  } else if (alg === 'selection') {
    for (let i = 0; i < n - 1; i++) {
      let m = i; snap(`Putaran ${i + 1}: cari kartu terkecil dari posisi ${i} sampai ${n - 1}.`, { key: [i] });
      for (let j = i + 1; j < n; j++) { c++; snap(`Bandingkan ${a[j]} dengan terkecil sementara ${a[m]}.`, { cmp: [j, m], key: [i] }); if (a[j] < a[m]) m = j; }
      if (m !== i) { const x = a[i], y = a[m]; a[i] = y; a[m] = x; w++; snap(`Tukar ${x} dan ${y}: ${y} (terkecil) pindah ke posisi ${i}.`, { swp: [i, m] }); }
      else snap(`${a[i]} sudah yang terkecil, tidak perlu menukar.`, { key: [i] });
      fin.add(i);
    }
    finAll(); snap('Selesai! Semua kartu terurut.');
  } else {
    fin.add(0);
    for (let i = 1; i < n; i++) {
      snap(`Ambil kartu ${a[i]} untuk disisipkan ke kelompok terurut di kiri.`, { key: [i] });
      let j = i - 1;
      while (j >= 0) {
        c++; snap(`Bandingkan ${a[j]} dengan ${a[j + 1]}.`, { cmp: [j, j + 1] });
        if (a[j] > a[j + 1]) { const x = a[j], y = a[j + 1]; a[j] = y; a[j + 1] = x; w++; snap(`${x} lebih besar, geser ke kanan.`, { swp: [j, j + 1] }); j--; } else break;
      }
      fin.add(i); snap(`Kartu tersisip. Kelompok terurut sekarang sampai posisi ${i}.`);
    }
    finAll(); snap('Selesai! Semua kartu terurut.');
  }
  return st;
}
const lastOf = (alg, arr) => { const s = sortSteps(alg, arr); return s[s.length - 1]; };

        ${[['1', 'Berapa kali perbandingan pada kondisi terbaik (best-case) dan terburuk (worst-case) saat mengurutkan 8 kartu dengan Bubble Sort dibanding Selection Sort?', 'Untuk 8 kartu: <b>Bubble Sort</b> (versi berhenti dini) butuh <b>7</b> perbandingan saat data sudah terurut dan <b>28</b> saat terbalik. <b>Selection Sort</b> selalu <b>28</b>, terbaik maupun terburuk, karena tetap memeriksa semua sisa kartu di tiap putaran. Bedanya, Selection Sort menukar paling banyak 7 kali, sedangkan Bubble Sort bisa sampai 28 kali. Buktikan di tabel lab dengan slider di 8 kartu.'], ['2', 'Mengapa Binary Search wajib mensyaratkan data terurut, sedangkan Sequential Search tidak?', 'Binary Search membuang separuh data berdasarkan satu perbandingan: jika elemen tengah lebih kecil dari target, ia menganggap target pasti di kanan. Anggapan itu hanya benar jika data terurut. Pada data acak, target bisa saja ada di bagian yang sudah dibuang. Sequential Search memeriksa satu per satu tanpa asumsi, jadi tidak peduli urutan. Buktikan dengan tombol "Data: acak" di arena pencarian.'], ['3', 'Skenario mana yang lebih menguntungkan ketika memilih Insertion Sort dibanding Bubble Sort?', 'Insertion Sort unggul ketika data <b>hampir terurut</b>, jumlahnya kecil, atau datang sedikit demi sedikit. Tiap kartu cukup digeser sedikit, mendekati n-1 perbandingan. Bubble Sort hanya menggeser kartu kecil satu posisi ke kiri per putaran, jadi satu kartu kecil yang terjebak di belakang memaksa banyak putaran.']].map(q => `<div class="card flat"><b>Pertanyaan ${q[0]}.</b> ${q[1]}<textarea id="an-${q[0]}" placeholder="Tulis dugaanmu dulu, baru buka pembahasan..." style="margin:10px 0"></textarea><details class="ans"><summary>Lihat pembahasan</summary><p style="margin:10px 0 0">${q[2]}</p></details></div>`).join('')}
      </div>
    </section>
    ${closing('Penutup dan refleksi', 'Algoritma yang efisien sangat bergantung pada struktur dan kondisi awal data. Dari semua yang kamu coba hari ini, kondisi data apa yang paling mengubah hasil? Tulis satu temuanmu.', 'p3')}
    ${pager(['p2', 'Pertemuan 2'], ['p4', 'Pertemuan 4'])}`;
  },
  init() {
    /* ---- 09 arena pencarian ---- */
    let smode = 'seq', sorted = true, data = SORTED15.slice(), sdone = new Set(), sst;
    const arena = () => {
      const t = +$('#sr-t').value; return searchSteps(data, t, smode);
    };
    const drawCells = s => {
      $('#sr-cells').innerHTML = data.map((v, i) => {
        let cl = '';
        if (smode === 'bin' && s && (i < s.lo || i > s.hi)) cl = 'out';
        if (s && smode === 'seq' && i === s.look) cl = 'look';
        if (s && smode === 'bin' && i === s.mid) cl = 'mid';
        if (s && s.found === i) cl = 'found';
        return `<div class="cell ${cl}">${v}<small>[${i}]</small></div>`;
      }).join('');
    };
    sst = makeStepper({
      steps: arena(),
      onReset() { drawCells(null); $('#sr-c').textContent = '0'; $('#sr-msg').className = 'info-note'; $('#sr-msg').textContent = 'Tekan "Langkah berikutnya".'; $('#sr-next').disabled = false; },
      onStep(s) { drawCells(s); $('#sr-c').textContent = s.c; $('#sr-msg').innerHTML = s.msg; },
      onEnd(last) {
        $('#sr-next').disabled = true; const t = +$('#sr-t').value;
        if (smode === 'bin' && !sorted && data.includes(t) && last.found < 0) { $('#sr-msg').className = 'bad-note'; $('#sr-msg').innerHTML += ' ⚠️ Padahal angka itu ADA di data! Binary Search gagal karena data tidak terurut.'; }
        sdone.add(smode + (sorted ? 'S' : 'A'));
        if (sdone.has('seqS') && sdone.has('binS')) markDone('a09');
      }
    });
    const setSteps = () => sst.set(arena());
    $$('[data-sm]').forEach(b => b.addEventListener('click', () => { smode = b.dataset.sm; $$('[data-sm]').forEach(x => x.classList.toggle('on', x === b)); setSteps(); }));
    $('#sr-t').addEventListener('change', setSteps);
    $('#sr-d').addEventListener('click', () => {
      sorted = !sorted; data = sorted ? SORTED15.slice() : shuffle(SORTED15); $('#sr-d').textContent = 'Data: ' + (sorted ? 'terurut' : 'acak (klik untuk acak lagi)'); setSteps();
      if (!sorted) $('#sr-msg').textContent = 'Data sudah diacak. Coba jalankan Binary Search sekarang.';
    });
    $('#sr-next').addEventListener('click', () => sst.next());
    $('#sr-auto').addEventListener('click', () => sst.play(700));
    $('#sr-reset').addEventListener('click', () => sst.reset());
    setSteps();

    /* ---- 10 tebak angka ---- */
    let secret, guesses, lo, hi, won;
    const gsNew = () => {
      secret = 1 + rnd(100); guesses = []; lo = 1; hi = 100; won = false;
      $('#gs-r').textContent = '1 - 100'; $('#gs-c').textContent = '0'; $('#gs-msg').className = 'info-note'; $('#gs-msg').textContent = 'Tebakan pertama?'; $('#gs-list').innerHTML = ''; $('#gs-in').value = ''; $('#gs-in').disabled = false; $('#gs-go').disabled = false;
      $('#gs-cmp').innerHTML = `<h4 style="margin:0">Bandingkan strategi</h4><p style="margin:0" class="muted">Menangkan satu ronde dulu, lalu bandingkan dengan Sequential dan Binary.</p>`;
    };
    const botGuesses = s => { const g = []; let l = 1, h = 100; while (true) { const m = Math.floor((l + h) / 2); g.push(m); if (m === s) break; if (m < s) l = m + 1; else h = m - 1; } return g; };
    const gsGo = () => {
      if (won) return; const g = parseInt($('#gs-in').value, 10);
      if (isNaN(g) || g < 1 || g > 100) { $('#gs-msg').textContent = 'Masukkan angka 1 sampai 100.'; return; }
      guesses.push(g); $('#gs-c').textContent = guesses.length;
      let tag = 'f';
      if (g === secret) { won = true; tag = 't'; $('#gs-msg').className = 'ok-note'; $('#gs-msg').textContent = `Benar! Angkanya ${secret}. Kamu butuh ${guesses.length} tebakan.`; $('#gs-in').disabled = true; $('#gs-go').disabled = true; }
      else if (g < secret) { lo = Math.max(lo, g + 1); $('#gs-msg').className = 'info-note'; $('#gs-msg').textContent = `${g} terlalu kecil.`; }
      else { hi = Math.min(hi, g - 1); $('#gs-msg').className = 'info-note'; $('#gs-msg').textContent = `${g} terlalu besar.`; }
      $('#gs-r').textContent = lo + ' - ' + hi; $('#gs-in').value = '';
      $('#gs-list').innerHTML = guesses.map((x, i) => `<span class="chip ${i === guesses.length - 1 ? tag : ''}">${x}</span>`).join('');
      if (won) {
        const bot = botGuesses(secret);
        $('#gs-cmp').innerHTML = `<h4 style="margin:0">Bandingkan strategi</h4>
          <div class="stat"><div>kamu<b>${guesses.length}</b></div><div>Binary bot<b>${bot.length}</b></div><div>Sequential<b>${secret}</b></div></div>
          <p style="margin:0">Binary bot selalu menebak angka tengah rentang: <span class="mono">${bot.join(' → ')}</span>.</p>
          <p style="margin:0">Sequential (1, 2, 3, ...) butuh ${secret} tebakan untuk angka ini, dan sampai 100 tebakan di kasus terburuk. Binary Search tidak pernah lebih dari <b>7</b> tebakan untuk 1 sampai 100, sebab setiap tebakan membuang separuh kemungkinan (100 → 50 → 25 → 12 → 6 → 3 → 1).</p>`;
        markDone('a10');
      }
    };
    $('#gs-go').addEventListener('click', gsGo); $('#gs-in').addEventListener('keydown', e => { if (e.key === 'Enter') gsGo(); }); $('#gs-new').addEventListener('click', gsNew); gsNew();

    /* ---- 11 kartu pengurutan ---- */
    let alg = 'bubble', pre = 'acak', n = 8, vals = [], base = [], steps = [], idx = 0, algsDone = new Set(), autoT = null;
    const makeVals = () => { vals = shuffle(Array.from({ length: 30 }, (_, i) => i + 1)).slice(0, n); };
    const makeBase = () => { base = pre === 'acak' ? vals.slice() : pre === 'urut' ? vals.slice().sort((a, b) => a - b) : vals.slice().sort((a, b) => b - a); };
    const stopAuto = () => { if (autoT) { clearInterval(autoT); autoT = null; } };
    const drawSo = () => {
      const s = steps[idx];
      $('#so-deck').innerHTML = s.a.map((v, i) => { let cl = ''; if (s.fin.includes(i)) cl = 'fin'; if (s.key.includes(i)) cl = 'key'; if (s.cmp.includes(i)) cl = 'cmp'; if (s.swp.includes(i)) cl = 'swp'; return `<div class="pc ${cl}">${v}<small>${i}</small></div>`; }).join('');
      $('#so-c').textContent = s.c; $('#so-w').textContent = s.w; $('#so-p').textContent = (idx + 1) + '/' + steps.length; $('#so-msg').innerHTML = s.msg;
      $('#so-wl').textContent = alg === 'insertion' ? 'pergeseran' : 'pertukaran';
      $('#so-prev').disabled = idx === 0; $('#so-next').disabled = idx === steps.length - 1;
      if (idx === steps.length - 1) { stopAuto(); algsDone.add(alg); if (algsDone.size >= 3) markDone('a11'); }
    };
    const soBuild = () => { stopAuto(); makeBase(); steps = sortSteps(alg, base); idx = 0; drawSo(); renderLab(); };
    const renderLab = () => {
      const asc = vals.slice().sort((a, b) => a - b), desc = asc.slice().reverse();
      const rows = [['bubble', 'Bubble Sort'], ['selection', 'Selection Sort'], ['insertion', 'Insertion Sort']];
      const cell = (a, arr) => { const l = lastOf(a, arr); return `${l.c} / ${l.w}`; };
      $('#lab').innerHTML = `<thead><tr><th>Algoritma (n = ${n})</th><th>Terurut (terbaik)</th><th>Acak (kartu di atas)</th><th>Terbalik (terburuk)</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${r[1]}</b></td><td>${cell(r[0], asc)}</td><td>${cell(r[0], vals)}</td><td>${cell(r[0], desc)}</td></tr>`).join('')}</tbody>`;
    };
    $('#so-next').addEventListener('click', () => { if (idx < steps.length - 1) { idx++; drawSo(); } });
    $('#so-prev').addEventListener('click', () => { stopAuto(); if (idx > 0) { idx--; drawSo(); } });
    $('#so-reset').addEventListener('click', () => { stopAuto(); idx = 0; drawSo(); });
    $('#so-auto').addEventListener('click', () => { stopAuto(); if (idx >= steps.length - 1) idx = 0; autoT = later(() => { if (idx < steps.length - 1) { idx++; drawSo(); } else stopAuto(); }, 650); });
    $$('[data-alg]').forEach(b => b.addEventListener('click', () => { alg = b.dataset.alg; $$('[data-alg]').forEach(x => x.classList.toggle('on', x === b)); soBuild(); }));
    $$('[data-pre]').forEach(b => b.addEventListener('click', () => { pre = b.dataset.pre; $$('[data-pre]').forEach(x => x.classList.toggle('on', x === b)); soBuild(); }));
    $('#so-n').addEventListener('input', e => { n = +e.target.value; $('#so-nv').textContent = n; makeVals(); soBuild(); });
    $('#so-new').addEventListener('click', () => { makeVals(); soBuild(); });
    makeVals(); soBuild();

    [1, 2, 3].forEach(k => { const t = $('#an-' + k); t.value = store.get('an-' + k, ''); t.addEventListener('input', () => store.set('an-' + k, t.value)); });
    bindRef('p3');
  }
};

        ${RUB.map((r, i) => `<tr><td><b>${r[0]}</b></td>${r[1].map((d, j) => `<td class="cellp ${sel[i] === 4 - j ? 'pick' : ''}" data-r="${i}" data-s="${4 - j}" tabindex="0" role="button" aria-pressed="${sel[i] === 4 - j}">${d}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
        <div class="card ${answered === RUB.length ? 'lime' : ''}" style="margin-top:16px"><h3 style="margin:0 0 6px">Skor penilaian diri: ${total}/20</h3>
          <p style="margin:0">${answered < RUB.length ? `Baru ${answered} dari 5 kriteria terisi.` : low.length ? `Kriteria yang masih bernilai 1 atau 2: <b>${low.join('; ')}</b>. Ini kandidat topik <a href="#susulan" data-go="susulan">remedial</a>.` : 'Semua kriteria bernilai 3 atau 4. Kamu siap menjajal <a href="#susulan" data-go="susulan">pengayaan</a>.'}</p>
          <div class="row" style="margin-top:10px"><button class="btn sm" id="rb-rst">Kosongkan</button></div></div>
        <p class="muted" style="font-size:.85rem;margin-top:10px">Hasil asesmen dipakai guru untuk memetakan ketercapaian dan menentukan intervensi: pengayaan atau remedial.</p>`;
        const pickIt = el => { sel[el.dataset.r] = +el.dataset.s; store.set('rub-sel', sel); draw(); };
        $$('.cellp').forEach(td => { td.addEventListener('click', () => pickIt(td)); td.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickIt(td); } }); });
        $('#rb-rst').addEventListener('click', () => { Object.keys(sel).forEach(k => delete sel[k]); store.set('rub-sel', sel); draw(); });
      };
      draw();
    };
    $$('[data-as]').forEach(b => b.addEventListener('click', () => { $$('[data-as]').forEach(x => x.classList.toggle('on', x === b)); b.dataset.as === 'quiz' ? quiz() : rubric(); }));
    quiz();
  }
};

/* ===== Pengayaan & Remedial ===== */
const cntBubble = a => { a = a.slice(); let c = 0; const n = a.length; for (let i = 0; i < n - 1; i++) { let sw = false; for (let j = 0; j < n - 1 - i; j++) { c++; if (a[j] > a[j + 1]) { const t = a[j]; a[j] = a[j + 1]; a[j + 1] = t; sw = true; } } if (!sw) break; } return c; };
const cntMerge = a => { let c = 0; const ms = x => { if (x.length <= 1) return x; const m = x.length >> 1, l = ms(x.slice(0, m)), r = ms(x.slice(m)), o = []; let i = 0, j = 0; while (i < l.length && j < r.length) { c++; if (l[i] <= r[j]) o.push(l[i++]); else o.push(r[j++]); } return o.concat(l.slice(i), r.slice(j)); }; ms(a); return c; };
const cntQuick = a => { let c = 0; const x = a.slice(); const qs = (lo, hi) => { if (lo >= hi) return; const p = x[hi]; let i = lo; for (let j = lo; j < hi; j++) { c++; if (x[j] < p) { const t = x[i]; x[i] = x[j]; x[j] = t; i++; } } const t = x[i]; x[i] = x[hi]; x[hi] = t; qs(lo, i - 1); qs(i + 1, hi); }; qs(0, x.length - 1); return c; };

function divideLevels(arr) {
  let lv = [[arr.slice()]];
  while (lv[lv.length - 1].some(g => g.length > 1)) {
    const prev = lv[lv.length - 1], next = [];
    prev.forEach(g => { if (g.length > 1) { const m = g.length >> 1; next.push(g.slice(0, m), g.slice(m)); } else next.push(g); });
    lv.push(next);
  }
  return lv;
}
const SCAF = [
  { q: 'Tugas: cetak "Boleh masuk" jika umur minimal 17. Baris pembuka percabangan yang benar?', o: ['IF umur >= 17 THEN', 'IF umur <- 17 THEN', 'WHEN umur >= 17', 'IF umur >= 17'], a: 0, why: 'Konvensi modul: IF kondisi THEN. Tanda "minimal" berarti >=.', hint: 'Ingat: <- hanya untuk memberi nilai, dan percabangan diakhiri kata THEN.' },
  { q: 'Isi blok THEN yang benar untuk mencetak teks?', o: ['OUTPUT "Boleh masuk"', 'OUTPUT Boleh masuk', 'umur <- "Boleh masuk"', 'THEN "Boleh masuk"'], a: 0, why: 'Teks dibungkus tanda petik dan dicetak dengan OUTPUT.', hint: 'Teks literal selalu memakai tanda petik.' },
  { q: 'Kata penutup percabangan?', o: ['END', 'ENDIF', 'ENDWHILE', 'STOP'], a: 1, why: 'IF ditutup dengan ENDIF (WHILE ditutup ENDWHILE).', hint: 'Penutup menyebut nama strukturnya.' }
];
const PRI = { 1: ['Gawat darurat', 'coral'], 2: ['Mendesak', 'sun'], 3: ['Biasa', 'sky'] };

pages.susulan = {
  render() {
    return `<div class="eyebrow">Program susulan</div><h1 style="font-size:clamp(1.9rem,5vw,3rem)">Pengayaan &amp; Remedial</h1>
    <p class="muted">Pengayaan untuk yang sudah mencapai KKTP lebih cepat. Remedial untuk yang belum mencapai ketercapaian minimal. Pilih jalurmu.</p>
    <div class="tabs"><button class="tab on" data-su="en">🚀 Pengayaan</button><button class="tab" data-su="re">🧩 Remedial</button></div>

    <div id="su-en">
      <section class="blk"><h2>Pengurutan tingkat lanjut: Divide and Conquer</h2>
        <p>Quick Sort dan Merge Sort membagi masalah jadi bagian kecil, menyelesaikannya, lalu menggabungkan. Lihat bagaimana Merge Sort membagi dan menggabung 8 angka.</p>
        <div class="card"><div class="row" style="margin-bottom:12px"><button class="btn sm" id="mg-new">Angka baru</button></div><div id="mg-view" class="stack"></div></div>
        <h3 style="margin-top:24px">Balapan perbandingan</h3>
        <p>Berapa kali tiap algoritma membandingkan dua angka? Tiap ukuran dijalankan 10 kali pada data acak, lalu dirata-rata. Bandingkan pertumbuhannya dengan Bubble Sort.</p>
        <div class="card"><div class="row"><button class="btn pri" id="rc-run">Jalankan balapan</button><span class="chip" style="background:var(--coral);color:var(--on)">Bubble</span><span class="chip" style="background:var(--sky);color:var(--on)">Merge</span><span class="chip" style="background:var(--mint);color:var(--on)">Quick</span></div>
        <div id="rc-out" class="stack" style="margin-top:14px"></div></div>
      </section>
      <section class="blk"><h2>Variasi antrean</h2>
        <div class="grid g2">
          <div class="card stack"><h3 style="margin:0">Circular Queue (kapasitas 5)</h3><p style="margin:0">Ruang yang kosong di depan dipakai ulang karena indeks "memutar" kembali ke 0 (<span class="mono">(indeks + 1) MOD kapasitas</span>).</p>
            <div class="row"><button class="btn sm pri" id="cq-enq">Enqueue</button><button class="btn sm warn" id="cq-deq">Dequeue</button><button class="btn sm" id="cq-rst">Reset</button></div>
            <div class="cells" id="cq-cells"></div><div class="info-note" id="cq-msg" aria-live="polite">Isi dan kosongkan antrean, lalu enqueue lagi saat sudah penuh sebagian.</div></div>
          <div class="card stack"><h3 style="margin:0">Priority Queue (antrean IGD)</h3><p style="margin:0">Yang keluar bukan yang paling dulu datang, melainkan yang paling prioritas. Prioritas sama dilayani sesuai urutan datang.</p>
            <div class="row"><select id="pq-p" aria-label="Prioritas">${Object.keys(PRI).map(k => `<option value="${k}">${k} - ${PRI[k][0]}</option>`).join('')}</select><button class="btn sm pri" id="pq-enq">Enqueue</button><button class="btn sm warn" id="pq-deq">Dequeue</button><button class="btn sm" id="pq-rst">Reset</button></div>
            <div class="lane" id="pq-lane" style="padding-top:12px"></div><div class="log" id="pq-log"></div></div>
        </div>
      </section>
    </div>

    <div id="su-re" hidden>
      <section class="blk"><h2>Pendampingan bertahap: IF-THEN</h2>
        <p>Susun satu percabangan tunggal langkah demi langkah. Setiap langkah punya petunjuk.</p>
        ${mcHTML('scaf', SCAF)}<div id="scaf-out"></div>
      </section>
      <section class="blk"><h2>Penelusuran visual ulang</h2>
        <p>Latih tracing berulang dengan kartu angka. Aturan: jika <code class="i">A &gt; B</code> BENAR, cetak <code class="i">"A Lebih Besar"</code>. Jika SALAH, tidak ada luaran. Capai 5 jawaban benar berturut-turut.</p>
        <div class="card stack">
          <div class="deck" style="padding:6px"><div class="pc" id="tr-a"></div><span style="align-self:center;font:800 1.6rem var(--f-head)">vs</span><div class="pc" id="tr-b"></div></div>
          <div class="row" style="justify-content:center"><div class="field"><label for="tr-k">Kondisi A &gt; B</label><select id="tr-k"><option>BENAR</option><option>SALAH</option></select></div>
            <div class="field"><label for="tr-o">Luaran</label><select id="tr-o"><option value="-">-</option><option value="Cetak &quot;A Lebih Besar&quot;">Cetak "A Lebih Besar"</option></select></div><button class="btn pri" id="tr-chk" style="align-self:flex-end">Cek</button></div>
          <div class="stat" style="justify-content:center"><div>beruntun<b id="tr-s">0</b></div><div>target<b>5</b></div></div>
          <div id="tr-msg" aria-live="polite" style="text-align:center"></div>
        </div>
      </section>
    </div>
    ${pager(['asesmen', 'Asesmen'], ['beranda', 'Beranda'])}`;
  },
  init() {
    $$('[data-su]').forEach(b => b.addEventListener('click', () => { $$('[data-su]').forEach(x => x.classList.toggle('on', x === b)); $('#su-en').hidden = b.dataset.su !== 'en'; $('#su-re').hidden = b.dataset.su !== 're'; }));

    /* merge sort levels */
    const mg = () => {
      const arr = shuffle(Array.from({ length: 40 }, (_, i) => i + 1)).slice(0, 8), dv = divideLevels(arr);
      const box = g => `<span style="display:inline-flex;gap:3px;border:2.5px solid var(--line);border-radius:8px;padding:3px 6px;background:var(--card);font:700 .9rem var(--f-mono)">${g.join(' ')}</span>`;
      const rowOf = (groups, label) => `<div><div class="muted mono" style="font-size:.72rem;margin-bottom:4px">${label}</div><div class="row" style="gap:6px">${groups.map(box).join('')}</div></div>`;
      const divRows = dv.map((lv, i) => rowOf(lv, i === 0 ? 'Awal' : `Bagi ${i}`));
      const mergeRows = dv.slice(0, -1).reverse().map((lv, i) => rowOf(lv.map(g => g.slice().sort((a, b) => a - b)), `Gabung ${i + 1}`));
      $('#mg-view').innerHTML = divRows.join('') + '<div class="chip" style="align-self:flex-start">↓ lalu digabung dengan urutan benar ↓</div>' + mergeRows.join('') + `<div class="ok-note">Hasil akhir: ${arr.slice().sort((a, b) => a - b).join(', ')}</div>`;
    };
    $('#mg-new').addEventListener('click', mg); mg();

    $('#rc-run').addEventListener('click', () => {
      const sizes = [8, 16, 32, 64, 128, 256], rows = sizes.map(n => {
        let b = 0, m = 0, q = 0;
        for (let k = 0; k < 10; k++) { const a = shuffle(Array.from({ length: n }, (_, i) => i)); b += cntBubble(a); m += cntMerge(a); q += cntQuick(a); }
        return [n, Math.round(b / 10), Math.round(m / 10), Math.round(q / 10)];
      });
      $('#rc-out').innerHTML = rows.map(r => { const mx = r[1]; const bar = (v, col) => `<div style="display:flex;align-items:center;gap:8px"><div style="height:14px;width:${Math.max(1.5, v / mx * 100)}%;background:var(--${col});border:2px solid var(--line);border-radius:6px"></div><span class="mono" style="font-size:.78rem">${v}</span></div>`; return `<div><b>n = ${r[0]}</b>${bar(r[1], 'coral')}${bar(r[2], 'sky')}${bar(r[3], 'mint')}</div>`; }).join('') + `<p class="muted" style="margin:0">Saat n bertambah dua kali lipat, Bubble Sort kira-kira naik empat kali lipat, sementara Merge dan Quick Sort hanya sedikit lebih dari dua kali lipat.</p>`;
    });

    /* circular queue */
    const CAP = 5; let cq, head, tail, cnt, cqn;
    const cqRst = () => { cq = Array(CAP).fill(null); head = 0; tail = 0; cnt = 0; cqn = 0; cqDraw(); $('#cq-msg').textContent = 'Isi dan kosongkan antrean, lalu enqueue lagi saat sudah penuh sebagian.'; };
    const cqDraw = () => { $('#cq-cells').innerHTML = cq.map((v, i) => `<div class="cell ${v !== null && i === head ? 'found' : ''} ${i === tail ? 'mid' : ''}" style="width:58px">${v === null ? '·' : v}<small>[${i}]${v !== null && i === head ? ' F' : ''}${i === tail ? ' R' : ''}</small></div>`).join(''); };
    $('#cq-enq').addEventListener('click', () => { if (cnt === CAP) { $('#cq-msg').textContent = 'Antrean PENUH. Dequeue dulu.'; return; } cqn++; cq[tail] = cqn; $('#cq-msg').textContent = `Enqueue ${cqn} di indeks ${tail}. Rear pindah ke (${tail} + 1) MOD ${CAP} = ${(tail + 1) % CAP}.`; tail = (tail + 1) % CAP; cnt++; cqDraw(); });
    $('#cq-deq').addEventListener('click', () => { if (!cnt) { $('#cq-msg').textContent = 'Antrean KOSONG.'; return; } const v = cq[head]; cq[head] = null; $('#cq-msg').textContent = `Dequeue ${v} dari indeks ${head}. Front pindah ke (${head} + 1) MOD ${CAP} = ${(head + 1) % CAP}.`; head = (head + 1) % CAP; cnt--; cqDraw(); });
    $('#cq-rst').addEventListener('click', cqRst); cqRst();

    /* priority queue */
    let pq = [], pseq = 0;
    const pqDraw = () => { const s = pq.slice().sort((a, b) => a.p - b.p || a.s - b.s); $('#pq-lane').innerHTML = s.length ? s.map((x, i) => `<div class="q-i ${i === 0 ? 'front' : ''}" style="background:var(--${PRI[x.p][1]});color:var(--on)">${x.name}<small style="color:#2a2f45">P${x.p} ${PRI[x.p][0]}</small></div>`).join('') : '<div class="q-i empty">kosong</div>'; $('#pq-deq').disabled = !s.length; };
    const plog = m => { const l = $('#pq-log'); l.innerHTML = m + '<br>' + l.innerHTML; };
    $('#pq-enq').addEventListener('click', () => { const p = +$('#pq-p').value; pseq++; const x = { p, s: pseq, name: NAMES[(pseq - 1) % NAMES.length] }; pq.push(x); plog(`ENQUEUE ${x.name} (prioritas ${p}).`); pqDraw(); });
    $('#pq-deq').addEventListener('click', () => { const s = pq.slice().sort((a, b) => a.p - b.p || a.s - b.s); const x = s[0]; pq = pq.filter(y => y !== x); plog(`DEQUEUE ${x.name} (prioritas ${x.p}) dilayani lebih dulu.`); pqDraw(); });
    $('#pq-rst').addEventListener('click', () => { pq = []; pseq = 0; $('#pq-log').innerHTML = ''; pqDraw(); }); pqDraw();

    /* remedial */
    mcInit('scaf', SCAF, () => { $('#scaf-out').innerHTML = `<div class="ok-note" style="margin-bottom:10px">Kamu berhasil menyusun IF-THEN utuh:</div>${code('IF umur >= 17 THEN\n  OUTPUT "Boleh masuk"\nENDIF')}`; });
    let streak = 0, A, B;
    const trNew = () => { A = 1 + rnd(20); B = 1 + rnd(20); if (rnd(4) === 0) B = A; $('#tr-a').textContent = A; $('#tr-b').textContent = B; };
    $('#tr-chk').addEventListener('click', () => {
      const real = A > B, rk = real ? 'BENAR' : 'SALAH', ro = real ? 'Cetak "A Lebih Besar"' : '-';
      const ok = $('#tr-k').value === rk && $('#tr-o').value === ro;
      if (ok) { streak++; $('#tr-msg').innerHTML = `<div class="ok-note">Tepat! ${A} &gt; ${B} itu ${rk}.</div>`; } else { streak = 0; $('#tr-msg').innerHTML = `<div class="bad-note">Belum tepat. ${A} &gt; ${B} itu ${rk}${real ? ', jadi ada luaran "A Lebih Besar"' : ', jadi tidak ada luaran'}. Streak diulang dari nol.</div>`; }
      $('#tr-s').textContent = streak;
      if (streak >= 5) { $('#tr-msg').innerHTML = '<div class="ok-note">5 benar berturut-turut! Tracing dasarmu sudah kuat. Coba lagi Pertemuan 1 atau kuis asesmen.</div>'; streak = 0; $('#tr-s').textContent = '5'; }
      trNew();
    });
    trNew();
  }
};

boot();
</script>

</body></html>
